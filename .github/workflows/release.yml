#  Builds and publishes a signed APK.
#
#  Pushing a `v*` tag cuts a release. Running this by hand from the Actions tab
#  does everything except publish — same build, same signature check, APK left
#  as a workflow artifact — which is how the signing secrets get verified
#  without spending a version number on the attempt.
#
#  There is no Play Store in this picture, so the release assets are the whole
#  distribution channel and the app updates itself from them. update.json is
#  what it reads; see UpdateCheck.kt.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    steps:
      # The full history, so --generate-notes has commits to describe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Into RUNNER_TEMP, not the workspace: nothing that gets archived or
      # packaged should ever contain the key.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DIVESLATE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DIVESLATE_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/diveslate.jks"
          echo "Keystore decoded, $(stat -c%s "$RUNNER_TEMP/diveslate.jks") bytes."

      # core:test runs here too. CI has already seen this commit in the ordinary
      # case, but nothing stops a tag being pushed at a commit whose CI went
      # red, and an APK published to people's phones is the wrong place to find
      # that out. It costs a minute.
      - name: Build signed release
        working-directory: android
        env:
          DIVESLATE_STORE_FILE: ${{ runner.temp }}/diveslate.jks
          DIVESLATE_STORE_PASSWORD: ${{ secrets.DIVESLATE_STORE_PASSWORD }}
          DIVESLATE_KEY_ALIAS: ${{ secrets.DIVESLATE_KEY_ALIAS }}
          DIVESLATE_KEY_PASSWORD: ${{ secrets.DIVESLATE_KEY_PASSWORD }}
        run: ./gradlew core:test :app:assembleRelease

      # AGP writes the versions it actually compiled in beside the APK. Read
      # them from there rather than grepping build.gradle.kts, which would be a
      # second source of truth for the number the updater compares.
      - name: Read built version
        id: version
        run: |
          meta=android/app/build/outputs/apk/release/output-metadata.json
          code=$(jq -r '.elements[0].versionCode' "$meta")
          name=$(jq -r '.elements[0].versionName' "$meta")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Built $name (versionCode $code)."

      # A tag that disagrees with the built versionName would publish
      # dive-slate-0.2.3.apk under v0.2.4 and leave the app reporting the old
      # number on its start screen. Cheaper to stop here than to unpublish.
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "v${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag $tag does not match versionName ${{ steps.version.outputs.name }}."
            echo "::error::Bump versionName and versionCode in android/app/build.gradle.kts first."
            exit 1
          fi

      # The build config claims to have signed this; the APK is the only thing
      # that can confirm it. A debug-signed release is worse than a failed one:
      # it installs, so nothing looks wrong until an update signed with the real
      # key is refused by every phone that has it.
      - name: Verify signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs -v "$apk" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK is signed with the shared debug key, not the release key."
            exit 1
          fi
          # v2 *or* v3, not v2 specifically. minSdk is 29 and v3 is verified from
          # API 28, so the signer drops the redundant v2 block and a release
          # built here is v3-only — an assertion naming v2 alone fails every
          # good APK. Both are checked because which one appears depends on
          # minSdk, and that is not this check's business.
          if ! grep -qE "Verified using v(2 scheme \(APK Signature Scheme v2\)|3 scheme \(APK Signature Scheme v3\)): true" /tmp/certs.txt; then
            echo "::error::APK carries neither a v2 nor a v3 signature."
            exit 1
          fi
          echo "Signed by: $(grep -m1 'certificate DN' /tmp/certs.txt || true)"

      # A versionCode that did not increase is an update no installed app will
      # ever take, because the check is a numeric comparison. The previous
      # release's manifest is the record of what is already out there.
      - name: Check versionCode increased
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --pattern update.json --dir /tmp/prev 2>/dev/null; then
            prev=$(jq -r '.versionCode' /tmp/prev/update.json)
            echo "Latest published versionCode: $prev"
            if [ "${{ steps.version.outputs.code }}" -le "$prev" ]; then
              echo "::error::versionCode ${{ steps.version.outputs.code }} is not greater than the published $prev."
              exit 1
            fi
          else
            echo "No previous release carrying update.json — treating this as the first."
          fi

      # The APK is named for its version so a downloads folder holding three of
      # them is still legible. update.json is what the in-app check reads, and
      # it is fetched from the /releases/latest/download/ path, which GitHub
      # always resolves to the newest published release — so the app needs no
      # API call, no token, and no knowledge of tag names.
      - name: Assemble release assets
        id: assets
        run: |
          version="${{ steps.version.outputs.name }}"
          mkdir -p dist
          apk="dive-slate-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$apk"

          sha=$(sha256sum "dist/$apk" | cut -d' ' -f1)
          size=$(stat -c%s "dist/$apk")
          echo "$sha  $apk" > "dist/$apk.sha256"

          repo_url="${{ github.server_url }}/${{ github.repository }}"
          tag="v$version"
          jq -n \
            --argjson versionCode ${{ steps.version.outputs.code }} \
            --arg versionName "$version" \
            --arg tag "$tag" \
            --arg apkUrl "$repo_url/releases/download/$tag/$apk" \
            --arg apkSha256 "$sha" \
            --argjson apkSize "$size" \
            --arg releaseUrl "$repo_url/releases/tag/$tag" \
            '$ARGS.named' > dist/update.json
          cat dist/update.json

          # R8 obfuscates; without this a stack trace off a user's phone is
          # unreadable, and it cannot be reconstructed after the fact.
          cp android/app/build/outputs/mapping/release/mapping.txt "dist/mapping-$version.txt"
          ls -l dist

      # On a manual run: keep the APK for 14 days and publish nothing. Enough to
      # confirm the secrets work and to install the result on a phone.
      - name: Upload artifact (manual run only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: dive-slate-unpublished
          path: dist/
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "Dive Slate ${{ steps.version.outputs.name }}" \
            --generate-notes \
            --verify-tag \
            dist/*
