#  Runs on every push to main and every pull request, so that a tag is only ever
#  cut from a tree that has already been seen green. The release workflow does
#  not re-run these — it builds the same commit CI just checked.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The conformance suite, plus a debug build of the app module. core:test is
  # the interesting half — it holds the parsers and all of the slate geometry
  # against conformance/ — but compiling :app is what catches a Compose or
  # resource break, which no JVM test can see.
  kotlin:
    name: Kotlin tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle distribution and dependencies. Build-cache entries are
      # keyed on input hashes, and core:test declares conformance/ as an input,
      # so a fixture change cannot be served a stale pass from the cache.
      - uses: gradle/actions/setup-gradle@v6

      # ANDROID_HOME is already set on the GitHub runner image, so no
      # local.properties is needed here.
      - name: Test and build
        working-directory: android
        run: ./gradlew core:test :app:assembleDebug

      # Only on failure: the HTML report is what says which assertion went, and
      # the console output alone often does not.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: android/core/build/reports/tests/test/
          retention-days: 7

  # Design-time only, and it does not ship — but tools/test_themes.py is what
  # notices that Themes.kt and the palette maths have drifted apart, which is
  # invisible to the Kotlin suite.
  python:
    name: Palette tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact patch, unlike every other action here, because
      # astral-sh/setup-uv publishes no moving major tag — its major tags stop
      # at v7 while releases are past v10, so `@v10` does not resolve at all.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # uv fetches the interpreter pyproject.toml asks for; the runner's own
      # Python is not used.
      - name: Sync
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy tools

      - name: Tests
        run: uv run pytest
