# The product is the Android app in `android/`. This project exists only to run
# the design-time scripts in `tools/`, which compute the colour palettes and
# bake them into Kotlin. Nothing here is packaged or published — hence
# `package = false`, which tells uv to build a venv for the dev dependencies
# without trying to install this directory as a distribution.

[project]
name = "diveslate-tools"
version = "0.1.0"
description = "Design-time palette tooling for the Dive Slate Android app."
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Charpentier", email = "paul.charpentier.99@gmail.com" }]

# The palette maths is pure standard library: OKLab conversion, CVD simulation
# and the WCAG contrast checks are all arithmetic. Keep it that way — this code
# has to stay readable as the definition of how the app's colours were chosen.
dependencies = []

[project.urls]
Homepage = "https://github.com/paul-charp/Dive-Slate"
Repository = "https://github.com/paul-charp/Dive-Slate"
Issues = "https://github.com/paul-charp/Dive-Slate/issues"

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tools"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
